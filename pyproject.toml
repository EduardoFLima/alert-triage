[project]
name = "alert-triage"
version = "0.1.0"
description = "First-pass triage of Datadog alerts, delivered as a report a human can act on."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
# Each capability slice adds the libraries it needs (see docs/vision.md), so
# the dependency tree stays legible.
dependencies = [
    "datadog-api-client>=2.30",
    # The MCP client is ADK's, not ours: a specialist reaches a platform's
    # toolset through ADK, so the protocol library arrives as ADK's extra and
    # at the version ADK supports.
    "google-adk[mcp]>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
alert-triage = "alert_triage.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alert_triage"]

[dependency-groups]
dev = [
    # Python 3.12 removed the stdlib's ``smtpd``; this is its successor, and is
    # what lets an integration test submit over a real socket to a real server.
    "aiosmtpd>=1.4",
    "import-linter>=2.3",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; module/class docstrings are noise.
"tests/**" = ["D100", "D101", "D103", "D104"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unreachable = true
# Each test directory carries its own conftest, so their basenames collide
# unless mypy resolves modules from a package base. This maps paths to module
# names; it relaxes no check.
mypy_path = "src"
explicit_package_bases = true
# Every relaxation belongs here as a named per-module override, never as a
# global loosening of the settings above.

#
# `datadog-api-client` ships a `py.typed` marker but leaves its constructors
# and exceptions unannotated, so calling them trips `disallow_untyped_calls`.
# This names that one library rather than relaxing the check: every other
# untyped call is still an error, and only the Datadog adapter imports this.
# mypy rejects `untyped_calls_exclude` in a per-module section, which is why
# it sits here rather than beside the adapter's module path.
untyped_calls_exclude = ["datadog_api_client"]

# The MCP SDK re-exports its HTTP client factory from the transport module
# without an explicit `__all__`, which `no_implicit_reexport` rejects. This
# names that one library rather than relaxing the check everywhere; only the
# Datadog MCP adapter imports it.
[[tool.mypy.overrides]]
module = ["mcp.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=alert_triage",
    "--cov-report=term-missing",
]
markers = [
    "unit: no external dependency, no network (tests/unit)",
    "integration: exercises an integration or real I/O (tests/integration)",
]

[tool.coverage.run]
branch = true
source = ["alert_triage"]

[tool.importlinter]
root_packages = ["alert_triage"]
include_external_packages = true

# Dependencies point inward only: app knows every layer, domain knows none.
[[tool.importlinter.contracts]]
name = "Hexagonal layers point inward"
type = "layers"
layers = [
    "alert_triage.app",
    "alert_triage.adapters",
    "alert_triage.ports",
    "alert_triage.domain",
]

# The layers contract lets all of `app` reach `adapters`; only the composition
# root should. This keeps the pipeline itself injectable as slices are added.
[[tool.importlinter.contracts]]
name = "The run takes adapters, it does not name them"
type = "forbidden"
source_modules = ["alert_triage.app.run"]
forbidden_modules = ["alert_triage.adapters"]

# The layers contract cannot see vendor SDKs; this one keeps them out of the core.
[[tool.importlinter.contracts]]
name = "Domain and ports are free of vendor libraries"
type = "forbidden"
source_modules = [
    "alert_triage.domain",
    "alert_triage.ports",
]
forbidden_modules = [
    "datadog",
    "datadog_api_client",
    "google",
    "mcp",
    "pydantic",
    "requests",
    "httpx",
    "smtplib",
    "urllib",
    "msal",
    "yaml",
    "dotenv",
]
