schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Full project vision, architecture, ports/adapters, agent design,
  config/circuit-breaker defaults, repo conventions, and the
  dependency-ordered capability slice breakdown live in docs/vision.md.
  Read that file before proposing or designing any change — do not
  duplicate its content here or in generated artifacts; reference it
  instead.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Be concise.
    - "Try to keep short: why now, capabilities, what changes, what is out of scope."
    - Refer to docs/vision.md, specs; never restate it.
  design:
    - Be concise.
    - "One short paragraph each: the choice, the alternative, why."
    - Do not restate requirements the proposal or delta spec already state.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
