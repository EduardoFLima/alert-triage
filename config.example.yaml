# Behavior: what the system watches and how it triages.
#
# Copy to `config.yaml` and keep only the keys you want to change — every key
# below except `scope.owner` is optional and the value shown is the default.
# The file itself is optional too.
#
# Connection settings (credentials, endpoints, where reports go) are never read
# from here; see `.env.example`. Any key naming one is inert.
#
# Every key here can also be set as an environment variable, by mapping its
# `section.key` path to `SECTION_KEY` (`scope.owner` -> `SCOPE_OWNER`). When
# both are set, the environment wins.

scope:
  # MANDATORY. The team whose alerts are triaged; no default, and a run that
  # cannot resolve it refuses to start.
  owner: sre
  # Optional. The services watched, and what their operators say about them.
  # Naming any narrows the run to those alone: alerts the owner owns for a
  # service not named here are not fetched, triaged, or recorded. Leave the
  # list out — the default — to watch every service the owner owns.
  #
  # An entry must name a service; every other key within it is optional.
  # SCOPE_SERVICES names the set from the environment, as a comma-separated
  # list that replaces this one, and each named service's own keys follow the
  # usual mapping under its name (SCOPE_SERVICES_CHECKOUT_CRITICAL).
  #services:
  #  # A service watched with nothing else said about it.
  #  - name: search
  #  - name: checkout
  #    # Optional. The latency this service is expected to operate within, in
  #    # milliseconds. No default: an incident is left alone — not
  #    # investigated, not reported — only when every alert in it reports a
  #    # latency at or under a figure an operator actually stated.
  #    acceptable_latency_ms: 250
  #    # Optional. Whether operators declared this service critical. Marks the
  #    # report and lets an investigation look harder; changes no cadence.
  #    critical: true

grouping:
  # Optional. How far apart alerts of one service may fire and still be treated
  # as one incident, in seconds.
  window_seconds: 1800

ingestion:
  # Optional. How far back from the start of a run alerts are considered, in
  # seconds. Keep comfortably wider than the interval the job runs on.
  lookback_seconds: 3600
  # Optional. Bound on a single request to the observability platform, in
  # seconds.
  request_timeout_seconds: 30
  # Optional. Retries of a failed platform request before the fetch gives up.
  max_retries: 3

investigation:
  # Optional. The model every specialist reasons on unless it is given one of
  # its own below. What it costs to reach that model is a connection setting
  # and is never read from here; see `.env.example`.
  model: gemini-2.5-flash
  # Optional. How many investigations one incident may be given in total, the
  # first included, before the system reports what fired without findings. One
  # disables retrying.
  max_attempts: 3
  # Optional. The specialists that reason on a model of their own, keyed by
  # specialist name. An entry is only worth writing to name a model, and a
  # specialist nobody declared is refused when the run is assembled. Every
  # declared specialist may be named here:
  #
  #   logs_specialist, apm_specialist, trace_specialist,
  #   infrastructure_specialist
  #
  # Left empty, as every specialist reasoning on the model above is the
  # default: uncommenting an entry is what gives that one a model of its own.
  #
  # Only specialists. The diagnostician that decides which of them an incident
  # needs, and the writer that words the report, both run on the model above and
  # cannot be named here yet; naming either is refused like any unknown key.
  specialists: {}
  # trace_specialist:
  #   # Mandatory within an entry. The model that specialist runs on.
  #   model: gemini-2.5-pro

re_notify:
  # Optional. How long after reporting an incident the system waits before
  # reporting it again, in seconds (2 days).
  cooldown_seconds: 172800

ledger:
  # Optional. How long a closed incident is kept for a human to consult before
  # it is deleted, in seconds (30 days). Counted from when the incident closed,
  # and tuned independently of the re-notify cooldown.
  retention_seconds: 2592000

circuit_breakers:
  # Optional. Tool calls one investigating agent may make.
  max_tool_calls_per_agent: 8
  # Optional. Handoffs between agents within one investigation.
  max_agent_hops: 2
  # Optional. Wall-clock bound on a single investigation, in seconds.
  max_investigation_duration_seconds: 300
  # Optional. Retries of a failed MCP call during an investigation.
  max_mcp_retries: 3
  # Optional. Timeout of a single MCP call, in seconds.
  mcp_call_timeout_seconds: 30

