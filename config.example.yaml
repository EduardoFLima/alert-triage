# Behavior: what the system watches and how it triages.
#
# Copy to `config.yaml` and keep only the keys you want to change — every key
# below except `scope` itself is optional and the value shown is the default.
# The file itself is optional too.
#
# Connection settings (credentials, endpoints, where reports go) are never read
# from here; see `.env.example`. A section naming one is refused.
#
# Every key here can also be set as an environment variable, by mapping its
# `section.key` path to `SECTION_KEY` (`scope.owner` -> `SCOPE_OWNER`). When
# both are set, the environment wins.

# MANDATORY: at least one of `owner` and `services`. There is no default and
# no "watch everything" fallback, and a run that resolves neither refuses to
# start. Set both and they narrow together: the named services of that owner.
scope:
  # Optional once `services` names a service. The team whose alerts are
  # triaged.
  owner: sre
  # Optional, keyed by service name. NAMING ANY SERVICE NARROWS TRIAGE TO THE
  # NAMED SERVICES — this is not a list of services to treat specially
  # alongside everything else the owner owns. Every key within an entry is
  # optional, and an entry may be listed with none of them (`payments: {}`).
  #
  # Left empty, as the owner alone is the default: uncommenting an entry is
  # what narrows the run to it. The whole set can equally be declared from the
  # environment as SCOPE_SERVICES, which replaces this section rather than
  # adding to it.
  services: {}
  # checkout:
  #   # Optional. Whether an incident on this service is investigated and
  #   # reported with more urgency. Says nothing about what is watched: a
  #   # critical service is fetched on the same terms as any other in scope.
  #   critical: true

grouping:
  # Optional. How far apart alerts of one service may fire and still be treated
  # as one incident, in seconds.
  window_seconds: 1800

ingestion:
  # Optional. How far back from the start of a run alerts are considered, in
  # seconds. Keep comfortably wider than the interval the job runs on.
  lookback_seconds: 3600
  # Optional. Bound on a single request to the observability platform, in
  # seconds.
  request_timeout_seconds: 30
  # Optional. Retries of a failed platform request before the fetch gives up.
  max_retries: 3

investigation:
  # Optional. The model every specialist reasons on unless it is given one of
  # its own below. What it costs to reach that model is a connection setting
  # and is never read from here; see `.env.example`.
  model: gemini-2.5-flash
  # Optional. How many investigations one incident may be given in total, the
  # first included, before the system reports what fired without findings. One
  # disables retrying.
  max_attempts: 3
  # Optional. The specialists that reason on a model of their own, keyed by
  # specialist name. An entry is only worth writing to name a model, and a
  # specialist nobody declared is refused when the run is assembled. Every
  # declared specialist may be named here:
  #
  #   logs_specialist, apm_specialist, trace_specialist,
  #   infrastructure_specialist
  #
  # Left empty, as every specialist reasoning on the model above is the
  # default: uncommenting an entry is what gives that one a model of its own.
  #
  # Only specialists. The diagnostician that decides which of them an incident
  # needs, and the writer that words the report, both run on the model above and
  # cannot be named here yet; naming either is refused like any unknown key.
  specialists: {}
  # trace_specialist:
  #   # Mandatory within an entry. The model that specialist runs on.
  #   model: gemini-2.5-pro

re_notify:
  # Optional. How long after reporting an incident the system waits before
  # reporting it again, in seconds (2 days).
  cooldown_seconds: 172800

ledger:
  # Optional. How long a closed incident is kept for a human to consult before
  # it is deleted, in seconds (30 days). Counted from when the incident closed,
  # and tuned independently of the re-notify cooldown.
  retention_seconds: 2592000

circuit_breakers:
  # Optional. Tool calls one specialist may make while investigating one
  # incident, counted across every consultation of it.
  max_tool_calls_per_agent: 8
  # Optional. Specialist consultations one investigation may make. A hop is the
  # reasoning reaching a specialist and that specialist reporting back, so this
  # is what one incident may cost in questions. Not a depth limit on agents
  # calling agents. Keep it above the number of specialists you have declared,
  # so an incident needing every signal still has a follow-up question left.
  max_agent_hops: 8
  # Optional. Wall-clock bound on a single investigation, in seconds. Once it
  # elapses the reasoning stops gathering and concludes on what it holds.
  max_investigation_duration_seconds: 300
  # Optional. Timeout of a single MCP call, in seconds, applied both while the
  # connection is established and while the response is read. A retried call is
  # two attempts of it, so one call can take twice this; the duration bound
  # above is what bounds the accumulation. How many times a call is retried is
  # owned by the agent framework and is deliberately not a setting here --
  # `max_mcp_retries` was removed, and a config still naming it is refused.
  mcp_call_timeout_seconds: 30
